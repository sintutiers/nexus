name: Sync game docs

on:
  push:
    branches: [v5]
    paths:
      - "content/long term celcit pixie horror game/TDD.md"
      - "content/long term celcit pixie horror game/FDD.md"
      - "content/long term celcit pixie horror game/GDD.md"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nexus
        uses: actions/checkout@v7
        with:
          path: nexus

      - name: Checkout game repo
        uses: actions/checkout@v7
        with:
          repository: sintutiers/celter-fairy-pixie-gameproject
          ref: master
          ssh-key: ${{ secrets.GAME_REPO_DEPLOY_KEY }}
          path: game

      - name: Copy docs
        run: |
          mkdir -p game/docs
          for f in TDD FDD GDD; do
            cp "nexus/content/long term celcit pixie horror game/$f.md" "game/docs/$f.md"
          done

      - name: Commit and push if changed
        working-directory: game
        run: |
          git add docs
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync design docs from nexus" -m "Source: sintutiers/nexus@${GITHUB_SHA::7}"
          git push
